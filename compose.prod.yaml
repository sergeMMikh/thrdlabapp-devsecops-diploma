services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PGDATABASE:-electrochemistry_lab}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD must be set}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-electrochemistry_lab}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app_net

  web:
    image: sergemmikh/thrdlabapp-devsecops-diploma:${IMAGE_TAG}
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PGHOST: db
      PGPORT: 5432

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn mysite.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 60
      "

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - app_net

volumes:
  postgres_data:
    external: true
    name: thrdlabapp-devsecops-diploma_postgres_data

networks:
  app_net:
    driver: bridge
