stages:
  - validate
  - auth
  - lint

validate:variables:
  stage: validate
  image: alpine:3.20

  script:
    - test -n "$DOCKERHUB_USERNAME"
    - test -n "$DOCKERHUB_TOKEN"
    - test -n "$DEPLOY_HOST"
    - test -n "$DEPLOY_PORT"
    - test -n "$DEPLOY_USER"
    - test -n "$DEPLOY_SSH_KEY"
    - echo "All required CI/CD variables are available"

auth:dockerhub:
  stage: auth
  image: docker:27-cli

  script:
    - echo "$DOCKERHUB_TOKEN" | docker login
      --username "$DOCKERHUB_USERNAME"
      --password-stdin
    - echo "Docker Hub authentication successful"
    - docker logout

auth:ssh:
  stage: auth
  image: alpine:3.20

  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    - install -m 600 "$DEPLOY_SSH_KEY" ~/.ssh/deploy_key
    - ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
    - chmod 600 ~/.ssh/known_hosts

  script:
    - >
      ssh
      -i ~/.ssh/deploy_key
      -p "$DEPLOY_PORT"
      -o BatchMode=yes
      -o StrictHostKeyChecking=yes
      "$DEPLOY_USER@$DEPLOY_HOST"
      'echo "SSH authentication successful"'

lint:
  stage: lint
  image: python:3.10-slim

  before_script:
    - python --version
    - pip install --no-cache-dir -r requirements-lint.txt

  script:
    - python -m flake8 .
