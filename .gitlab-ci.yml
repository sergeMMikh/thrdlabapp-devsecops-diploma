stages:
  - validate
  - auth
  - lint

validate:variables:
  stage: validate
  image: alpine:3.20

  script:
    - test -n "$DOCKERHUB_USERNAME"
    - test -n "$DOCKERHUB_TOKEN"
    - test -n "$DEPLOY_HOST"
    - test -n "$DEPLOY_PORT"
    - test -n "$DEPLOY_USER"
    - test -n "$DEPLOY_SSH_KEY"
    - echo "All required CI/CD variables are available"

auth:dockerhub:
  stage: auth
  image: docker:27-cli

  script:
    - echo "$DOCKERHUB_TOKEN" | docker login
      --username "$DOCKERHUB_USERNAME"
      --password-stdin
    - echo "Docker Hub authentication successful"
    - docker logout

lint:
  stage: lint
  image: python:3.10-slim

  before_script:
    - python --version
    - pip install --no-cache-dir -r requirements-lint.txt

  script:
    - python -m flake8 .
