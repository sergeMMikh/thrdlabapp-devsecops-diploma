workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "stage_4"'
    - when: never

stages:
  - validate
  - auth
  - lint
  - test
  - sast
  - secret-scan
  - build
  - deploy
  - security-check
  - security-scan

validate:variables:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  stage: validate
  tags:
    - thrdlabapp
    - docker
    - build
  image: alpine:3.20

  script:
    - test -n "$DOCKERHUB_USERNAME"
    - test -n "$DOCKERHUB_TOKEN"
    - test -n "$DEPLOY_HOST"
    - test -n "$DEPLOY_PORT"
    - test -n "$DEPLOY_USER"
    - test -n "$DEPLOY_SSH_KEY"
    - echo "All required CI/CD variables are available"

auth:dockerhub:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  stage: auth
  tags:
    - thrdlabapp
    - docker
    - build
  image: docker:27-cli

  script:
    - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
    - echo "Docker Hub authentication successful"
    - docker logout

auth:ssh:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  stage: auth
  image: alpine:3.20

  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    - install -m 600 "$DEPLOY_SSH_KEY" ~/.ssh/deploy_key
    - ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
    - chmod 600 ~/.ssh/known_hosts

  script:
    - >
      ssh
      -i ~/.ssh/deploy_key
      -p "$DEPLOY_PORT"
      -o BatchMode=yes
      -o StrictHostKeyChecking=yes
      "$DEPLOY_USER@$DEPLOY_HOST"
      'echo "SSH authentication successful"'

lint:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  stage: lint
  tags:
    - thrdlabapp
    - docker
    - build
  image: python:3.10-slim

  before_script:
    - python --version
    - pip install --no-cache-dir -r requirements-lint.txt

  script:
    - python -m flake8 .

test:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  stage: test
  tags:
    - thrdlabapp
    - docker
    - build
  image: python:3.10-slim

  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends chromium chromium-driver
    - rm -rf /var/lib/apt/lists/*
    - python --version
    - chromium --version
    - chromedriver --version
    - pip install --no-cache-dir -r requirements.txt

  script:
    - python -m pytest -q --junitxml=pytest-report.xml

  artifacts:
    when: always
    reports:
      junit: pytest-report.xml
    paths:
      - pytest-report.xml
    expire_in: 1 week

sast:bandit:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  stage: sast
  tags:
    - thrdlabapp
    - security
    - sast
  image: python:3.10-slim
  needs:
    - test

  before_script:
    - python --version
    - pip install --no-cache-dir -r requirements-security.txt

  script:
    - bandit -r . -f json -o bandit-report.json || true

  artifacts:
    when: always
    paths:
      - bandit-report.json
    expire_in: 1 week

sast:semgrep:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  stage: sast
  tags:
    - thrdlabapp
    - security
    - sast
  image: semgrep/semgrep:1.136.0
  needs:
    - test

  script:
    - semgrep scan --config auto --json --output semgrep-report.json .

  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 1 week

  allow_failure: true

security:trufflehog:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "stage_4"'

  stage: secret-scan
  tags:
    - thrdlabapp
    - security
    - sast
  image:
    name: ghcr.io/trufflesecurity/trufflehog:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"

  script:
    - trufflehog --version
    - trufflehog git "file://$CI_PROJECT_DIR" --json --no-update > trufflehog-report.json
    - echo "TruffleHog secret scan completed"

  artifacts:
    when: always
    paths:
      - trufflehog-report.json
    expire_in: 1 week

build:image:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  stage: build
  tags:
    - thrdlabapp
    - docker
    - build
  image: docker:27-cli
  needs:
    - test

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

  script:
    - IMAGE="$DOCKERHUB_USERNAME/thrdlabapp-devsecops-diploma"
    - TAG="$CI_COMMIT_SHORT_SHA"
    - echo "Building Docker image with tag $TAG"
    - docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$TAG"
    - docker push "$IMAGE:latest"
    - echo "Docker image published successfully"

  after_script:
    - docker logout

deploy:production:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  stage: deploy
  image: alpine:3.20
  needs:
    - build:image
    - sast:bandit
    - sast:semgrep

  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    - install -m 600 "$DEPLOY_SSH_KEY" ~/.ssh/deploy_key
    - ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
    - chmod 600 ~/.ssh/known_hosts

  script:
    - >
      ssh
      -i ~/.ssh/deploy_key
      -p "$DEPLOY_PORT"
      -o BatchMode=yes
      -o StrictHostKeyChecking=yes
      "$DEPLOY_USER@$DEPLOY_HOST"
      "
      cd ~/thrdlabapp-devsecops-diploma &&
      export IMAGE_TAG='$CI_COMMIT_SHORT_SHA' &&
      docker compose -f compose.prod.yaml pull web &&
      docker compose -f compose.prod.yaml up -d &&
      docker compose -f compose.prod.yaml ps
      "

security:check-connection:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  stage: security-check
  tags:
    - thrdlabapp
    - security
    - dast
  image: curlimages/curl:latest
  needs:
    - deploy:production

  script:
    - 'echo "Checking DAST target availability..."'
    - 'curl --fail --show-error --silent --location --retry 3 --retry-delay 5 --connect-timeout 10 https://diploma.smmikh.pt/ --output /dev/null'
    - 'echo "DAST target is available over HTTPS"'

security:zap-baseline:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  stage: security-scan
  tags:
    - thrdlabapp
    - security
    - dast
  image: ghcr.io/zaproxy/zaproxy:stable
  needs:
    - security:check-connection

  script:
    - mkdir -p /zap/wrk
    - 'zap-baseline.py -t https://diploma.smmikh.pt -J zap-report.json -r zap-report.html -w zap-report.md || true'
    - cp /zap/wrk/zap-report.* .

  artifacts:
    when: always
    paths:
      - zap-report.json
      - zap-report.html
      - zap-report.md
    expire_in: 1 week

  allow_failure: true
